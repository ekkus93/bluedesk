# detekt overrides (merged over the default config via buildUponDefaultConfig).
# Rules disabled here are noise for an Android/HID codebase; the structural
# complexity rules are intentionally left ON and their existing findings are
# grandfathered in detekt-baseline.xml so only new ones fail the build.

style:
  MagicNumber:
    # Enforced. Pure byte/keycode tables use @file:Suppress("MagicNumber");
    # property declarations (color/setting constants) are ignored.
    active: true
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
    # Imports are unwrappable in Kotlin; everything else (incl. comments
    # and package statements) is enforced.
    excludeImportStatements: true
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    excludeGuardClauses: true

exceptions:
  TooGenericExceptionCaught:
    # Enabled. Existing broad catches around platform calls (each logs the
    # exception) are defensive and grandfathered via baseline; narrowing them
    # would let other exceptions crash the service.
    active: true
  SwallowedException:
    active: true

naming:
  PackageNaming:
    # The package intentionally contains an underscore (matches the applicationId).
    active: false
  FunctionNaming:
    # @Composable functions are intentionally PascalCase.
    ignoreAnnotated: ['Composable']

empty-blocks:
  EmptyFunctionBlock:
    # No-op overrides (e.g. interface stubs / unused service callbacks) are intentional.
    ignoreOverridden: true

complexity:
  CyclomaticComplexMethod:
    # A flat dispatch/lookup `when` with one-line branches is not "complex" in the
    # harmful sense; don't count single-expression when-entries toward complexity.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # A HID service/interface is cohesive but large by nature (keyboard + mouse +
    # connection + discovery + pairing is naturally 20-40 methods). Use
    # domain-appropriate thresholds rather than fragmenting cohesive types.
    thresholdInClasses: 60
    thresholdInInterfaces: 35
    thresholdInObjects: 60
    thresholdInFiles: 60
  LargeClass:
    # BluetoothService is a large but cohesive foreground service; allow headroom
    # so extracting private helpers (for readability) doesn't trip this.
    threshold: 800
