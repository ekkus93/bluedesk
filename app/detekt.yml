# detekt overrides (merged over the default config via buildUponDefaultConfig).
# Rules disabled here are noise for an Android/HID codebase; the structural
# complexity rules are intentionally left ON and their existing findings are
# grandfathered in detekt-baseline.xml so only new ones fail the build.

style:
  MagicNumber:
    # Enforced. Pure byte/keycode tables use @file:Suppress("MagicNumber");
    # property declarations (color/setting constants) are ignored.
    active: true
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    # ktlint's max-line-length already exempts comments (KDoc, a copy-paste
    # command line, etc.); match that so the two tools agree.
    excludeCommentStatements: true
  WildcardImport:
    active: true
  ReturnCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    # Android platform calls are guarded with broad catches by design.
    active: false
  SwallowedException:
    active: false

naming:
  PackageNaming:
    # The package intentionally contains an underscore (matches the applicationId).
    active: false
  FunctionNaming:
    # @Composable functions are intentionally PascalCase.
    ignoreAnnotated: ['Composable']

empty-blocks:
  EmptyFunctionBlock:
    # No-op overrides (e.g. interface stubs / unused service callbacks) are intentional.
    ignoreOverridden: true
