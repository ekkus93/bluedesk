name: One-shot post-Fix3 evidence reconciliation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Run post-Fix3 evidence reconciliation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconcile evidence bookkeeping
        run: python3 .github/scripts/reconcile_post_fix3_evidence_docs.py

      - name: Verify pending hardware/manual boundary remains open
        shell: bash
        run: |
          git diff --check
          grep -F 'Physical Classic HID exact-SHA run: `PENDING — REQUIRED' docs/BLUEDECK_POST_FIX3_CORRECTNESS_UI_HARDENING_TODO_2026-08-08.md
          grep -F -- '- [ ] PENDING — run physical Classic HID validation' docs/BLUEDECK_POST_FIX3_CORRECTNESS_UI_HARDENING_TODO_2026-08-08.md
          grep -F 'BLE device smoke: `PENDING' docs/BLUEDECK_POST_FIX3_CORRECTNESS_UI_HARDENING_TODO_2026-08-08.md
          grep -F 'Manual UX smoke: `PENDING' docs/BLUEDECK_POST_FIX3_CORRECTNESS_UI_HARDENING_TODO_2026-08-08.md
          grep -F -- '- [ ] Visually verify that arrow key buttons' docs/UIUX_FIXES1_TODO.md
          grep -F -- '- [x] Write the missing UI test for the nav guard snackbar.' docs/UIUX_FIXES1_TODO.md

      - name: Commit reconciled docs and remove one-shot tooling
        shell: bash
        run: |
          git rm .github/scripts/reconcile_post_fix3_evidence_docs.py
          git rm .github/workflows/reconcile-post-fix3-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BLUEDECK_POST_FIX3_CORRECTNESS_UI_HARDENING_TODO_2026-08-08.md docs/UIUX_FIXES1_TODO.md
          git diff --cached --check
          git commit -m 'Reconcile post-Fix3 hardening evidence [skip ci]'
          git push origin HEAD:master
