name: One-shot ktlint line fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-shot ktlint line fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply bounded line-length fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('app/src/main/java/com/augustusmachin/android_bt_kbmouse/BluetoothService.kt')
          text = service.read_text()

          replacements = [
              (
                  '                val requested = bluetoothAdapter?.getProfileProxy(this, profileListener, BluetoothProfile.HID_DEVICE) == true',
                  '''                val requested =\n                    bluetoothAdapter?.getProfileProxy(\n                        this,\n                        profileListener,\n                        BluetoothProfile.HID_DEVICE,\n                    ) == true''',
              ),
              (
                  '                val message = "Remembered Bluetooth device could not be resolved: ${e.message ?: e.javaClass.simpleName}"',
                  '''                val detail = e.message ?: e.javaClass.simpleName\n                val message = "Remembered Bluetooth device could not be resolved: $detail"''',
              ),
              (
                  '            "ConnectProfile(HID, $HID_PROFILE_UUID) procedure first; use bluetoothctl connect only as a diagnostic fallback."',
                  '''            "ConnectProfile(HID, $HID_PROFILE_UUID) procedure first; " +\n            "use bluetoothctl connect only as a diagnostic fallback."''',
              ),
              (
                  '                val message = "Device was forgotten locally, but system unpair failed: ${e.message ?: e.javaClass.simpleName}"',
                  '''                val detail = e.message ?: e.javaClass.simpleName\n                val message = "Device was forgotten locally, but system unpair failed: $detail"''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'Expected BluetoothService pattern not found: {old}')
              text = text.replace(old, new)
          service.write_text(text)

          pairing = Path('app/src/main/java/com/augustusmachin/android_bt_kbmouse/PairingScreen.kt')
          text = pairing.read_text()
          old = '                    activity != null && denied.any { !ActivityCompat.shouldShowRequestPermissionRationale(activity, it) }'
          new = '''                    activity != null &&\n                        denied.any {\n                            !ActivityCompat.shouldShowRequestPermissionRationale(activity, it)\n                        }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one PairingScreen rationale pattern, found {text.count(old)}')
          pairing.write_text(text.replace(old, new))
          PY

      - name: Verify style and static analysis
        run: ./gradlew :app:ktlintCheck :app:detekt --stacktrace

      - name: Commit bounded fixes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/augustusmachin/android_bt_kbmouse/BluetoothService.kt app/src/main/java/com/augustusmachin/android_bt_kbmouse/PairingScreen.kt
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'Fix remaining ktlint line-length violations'
          git push origin HEAD:master
