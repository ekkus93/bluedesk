name: One-shot bounded hardening cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run bounded hardening cleanup v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply bounded cleanup
        run: python3 .github/scripts/bounded_hardening_cleanup.py

      - name: Format Kotlin sources
        run: ./gradlew :app:ktlintFormat --stacktrace

      - name: Verify style and static analysis
        run: ./gradlew :app:ktlintCheck :app:detekt --stacktrace

      - name: Commit bounded fixes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'Clear hardening static-analysis gates'
          git push origin HEAD:master
