name: One-shot post-Fix3 evidence-test cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run final evidence-test cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Integrate explicit IME load-state model
        run: python3 .github/scripts/post_fix3_ime_load_state_cleanup.py

      - name: Format Kotlin sources
        run: ./gradlew :app:ktlintFormat --stacktrace

      - name: Verify unit, instrumented compile, and static gates
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:ktlintCheck :app:detekt --stacktrace

      - name: Commit bounded integration
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'Complete hardening evidence tests'
          git push origin HEAD:master
