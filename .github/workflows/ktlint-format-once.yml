name: One-shot ktlint formatter

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Trigger ktlint formatter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply ktlint formatter
        continue-on-error: true
        run: ./gradlew :app:ktlintFormat --stacktrace

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src
          git commit -m 'Apply ktlint formatter output'
          git push origin HEAD:master
