name: CI

# Build, unit-test, compile instrumented tests, and lint on every push/PR to master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile instrumented UI tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: ktlint
        run: ./gradlew :app:ktlintCheck --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace
