name: Release

# Fires only on version tags (e.g. v0.1, v1.2.3). Builds the APK, gates on the
# unit tests, then publishes a GitHub Release with the APK attached as an asset.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK with release name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "bluedeck-${{ github.ref_name }}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BlueDeck ${{ github.ref_name }}
          generate_release_notes: true
          files: bluedeck-${{ github.ref_name }}-debug.apk
